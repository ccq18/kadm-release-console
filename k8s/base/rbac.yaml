apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: onecd-rollouts
  namespace: apps
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - rollouts
    verbs:
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - argoproj.io
    resources:
      - rollouts/status
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: onecd-rollouts
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: onecd
    namespace: onecd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: onecd-rollouts
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: onecd-cluster-read
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: onecd-cluster-read
subjects:
  - kind: ServiceAccount
    name: onecd
    namespace: onecd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: onecd-cluster-read
